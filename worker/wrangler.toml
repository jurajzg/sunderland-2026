name = "sunderland-2026-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sunderland-db"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sunderland-tickets"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
